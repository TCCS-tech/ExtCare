services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tccs
      POSTGRES_PASSWORD: tccs
      POSTGRES_DB: tccs_checkin
    ports:
      - "5432:5432"
    volumes:
      - tccs_checkin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tccs -d tccs_checkin"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tccs_checkin_pg:
